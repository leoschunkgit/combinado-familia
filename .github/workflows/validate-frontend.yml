name: Validate Frontend

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build web and app frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      VITE_PUBLIC_APP_URL: https://www.combinadofamilia.app.br
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web
        run: npm run build

      - name: Build closed app frontend
        run: npm run build:app:closed
