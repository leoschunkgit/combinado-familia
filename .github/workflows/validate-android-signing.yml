name: Validate Android Release Signing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_PUBLIC_APP_URL: https://www.combinadofamilia.app
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npm run build:app
      - run: npx cap add android
      - run: npm run app:assets
      - run: npx cap sync android

      - name: Create ephemeral credentials and key
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASS=$(openssl rand -hex 16)
          KEY_PASS=$(openssl rand -hex 16)
          echo "STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=combinado-ci" >> "$GITHUB_ENV"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/combinado-ci.jks" >> "$GITHUB_ENV"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/combinado-ci.jks" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias combinado-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=Combinado Familia CI, OU=CI, O=Combinado Familia, C=BR"

      - name: Configure release signing
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s = s.replace('android {', '''android {
              signingConfigs {
                  ciRelease {
                      storeFile file(System.getenv("KEYSTORE_PATH"))
                      storePassword System.getenv("STORE_PASS")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASS")
                  }
              }
          ''', 1)
          s = s.replace('release {', 'release {\n            signingConfig signingConfigs.ciRelease', 1)
          p.write_text(s)
          PY

      - name: Build signed release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Verify signature
        shell: bash
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          jarsigner -verify "$AAB"
          keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" | grep 'SHA256:'

      - name: Upload signed CI AAB
        uses: actions/upload-artifact@v4
        with:
          name: combinado-familia-ci-signed-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 3