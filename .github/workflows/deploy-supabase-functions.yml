name: Deploy Supabase Edge Function

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-excluir-conta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::GitHub secret SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

      - name: Deploy excluir-conta
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy excluir-conta \
            --project-ref ojanhkqxxzpiyhydlmli
